name: Daily Wholesale Price Ingestion

on:
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC = 9:00 AM IST
    - cron: "0 9 * * *" # 09:00 UTC = 2:30 PM IST
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Diagnose Data.gov.in connectivity
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          url = (
              "https://api.data.gov.in/resource/"
              "9ef84268-d588-465a-a308-a864a43d0070"
          )

          api_key = os.environ.get("DATA_GOV_API_KEY", "").strip()

          if not api_key:
              raise SystemExit(
                  "DATA_GOV_API_KEY secret is missing or empty."
              )

          params = {
              "api-key": api_key,
              "format": "json",
              "limit": 1,
          }

          try:
              response = requests.get(
                  url,
                  params=params,
                  timeout=(10, 20),
              )
              print("HTTP status:", response.status_code)
              response.raise_for_status()
              print("API connectivity test passed.")
          except requests.RequestException as exc:
              print(
                  "API connectivity test failed:",
                  type(exc).__name__,
                  str(exc),
              )
              raise
          PY

      - name: Run ingestion script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python pipeline/load_wholesale_data.py

      - name: Load retail manual entries
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RETAIL_SHEET_URL: ${{ secrets.RETAIL_SHEET_URL }}
        run: python ingestion/load_retail_manual.py

      - name: Generate retail model
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python ingestion/generate_retail_model.py

      - name: Run anomaly detection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline/run_anomaly_detection.py